<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>eng_navi 英語クイズ</title>
<meta name="description" content="Instagram @eng_navi のリールの続き。TOEIC・英検の文法クイズと、読解・イディオムをタップで答え合わせ。音声つき。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital@1&family=EB+Garamond:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 色はリールと同じ3色。data-series で切り替える */
  :root, [data-series="blue"] {
    --bg: #fdfdfd;
    --bar: #adc8d1;
    --hl: #dee9ed;
    --accent: #acc7d1;
    --accent-ink: #5f8a99;
    --mark: linear-gradient(var(--hl), var(--hl));
  }
  [data-series="green"] {
    --bg: #f7f4ed;
    --bar: #456142;
    --hl: #afbbab;
    --accent: #456142;
    --accent-ink: #456142;
    /* 緑は文字の下半分に引くマーカー */
    --mark: linear-gradient(transparent 60%, var(--hl) 60%, var(--hl) 92%, transparent 92%);
  }
  [data-series="pink"] {
    --bg: #fdfdfd;
    --bar: #f7b6ba;
    --hl: #fce2e4;
    --accent: #f7b6ba;
    --accent-ink: #d98088;
    --mark: linear-gradient(var(--hl), var(--hl));
  }
  :root {
    --ink: #1e1e1e;
    --sub: #6b6b6b;
    --line: #e6ecee;
    --ok: #5f8a99;
    --ng: #c97a7a;
    --ng-bg: #fbeeee;
    --serif: "EB Garamond", "Times New Roman", serif;
    --num: "Crimson Text", var(--serif);
    --sans: "Noto Sans JP", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); transition: background .3s; }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  .app {
    position: relative;
    max-width: 480px;
    min-height: 100dvh;
    margin: 0 auto;
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom)) calc(min(8vw, 38px) + 22px);
    display: flex;
    flex-direction: column;
  }
  .app::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: min(8vw, 38px);
    background: var(--bar);
    transition: background .3s;
  }

  /* ヘッダー */
  .top { display: flex; align-items: center; justify-content: space-between; min-height: 40px; gap: 8px; }
  .lefthead { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .home { font-size: 12px; color: var(--sub); padding: 8px 8px 8px 0; white-space: nowrap; }
  .progress { display: flex; gap: 4px; flex-wrap: wrap; }
  .progress i { width: 10px; height: 4px; border-radius: 2px; background: var(--line); transition: background .3s; }
  .progress i.done { background: var(--accent); }
  .progress i.now { background: var(--accent-ink); }
  .toggles { display: flex; gap: 4px; flex: none; }
  .sound { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--accent-ink); padding: 8px 0 8px 6px; white-space: nowrap; }
  .sound svg { width: 18px; height: 18px; }
  .sound[aria-pressed="false"] { color: #b9b9b9; }
  .bgm-wrap { position: relative; }
  .bgm-menu {
    position: absolute; right: 0; top: calc(100% + 4px); z-index: 10; min-width: 200px; padding: 8px;
    background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
    animation: pop .2s ease-out;
  }
  .bgm-menu p { font-size: 11px; color: #9a9a9a; letter-spacing: .1em; padding: 4px 10px 6px; }
  .bgm-menu button { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 10px; border-radius: 10px; font-size: 14px; text-align: left; color: var(--ink); }
  .bgm-menu button small { font-size: 11px; color: #9a9a9a; }
  .bgm-menu .credit { margin-top: 6px; padding: 8px 10px 4px; border-top: 1px solid var(--line); font-size: 10px; line-height: 1.6; letter-spacing: 0; }
  .bgm-menu .credit a { color: inherit; }
  .bgm-menu button[aria-checked="true"] { background: var(--hl); color: var(--accent-ink); font-weight: 500; }

  .num { font-family: var(--num); font-style: italic; font-size: 36px; color: var(--accent); margin-top: 18px; line-height: 1; letter-spacing: .04em; }
  .title { font-size: 26px; font-weight: 500; letter-spacing: .06em; color: var(--accent); margin-top: 22px; line-height: 1.35; }
  [data-series="green"] .title { font-weight: 700; letter-spacing: .02em; }

  /* 問題文:リールと同じく左から伸びるハイライト */
  .q { font-family: var(--serif); font-size: 25px; line-height: 1.55; margin-top: 26px; }
  [data-series="green"] .q { font-size: 28px; }
  .q .mark {
    background: var(--mark) no-repeat 0 0 / 0% 100%;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
    padding: 1px 4px;
    margin-left: -4px;
    animation: wipe .45s .35s ease-in-out forwards;
  }
  @keyframes wipe { to { background-size: 100% 100%; } }
  .nw { white-space: nowrap; }
  .blank { display: inline-block; min-width: 3.2em; text-align: center; }
  .blank.filled { color: var(--accent-ink); font-weight: 500; animation: pop .35s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } }
  .listen {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 14px;
    font-size: 12px; color: var(--accent-ink);
    padding: 6px 12px 6px 10px; border: 1px solid var(--hl); border-radius: 999px;
  }
  .listen svg { width: 16px; height: 16px; }

  /* 選択肢 */
  .opts { margin-top: 30px; display: grid; gap: 12px; }
  .opt {
    display: flex; align-items: center; gap: 18px; width: 100%; text-align: left;
    padding: 10px 12px; margin-left: -12px; border-radius: 12px;
    opacity: 0; transform: translateX(-16px);
    animation: slide .35s .3s ease-in-out forwards;
    transition: background .2s;
  }
  .opt:nth-child(2) { animation-delay: .5s; }
  .opt:nth-child(3) { animation-delay: .7s; }
  @keyframes slide { to { opacity: 1; transform: none; } }
  .opt .c {
    flex: none; width: 46px; height: 46px; border: 2.5px solid var(--ink); border-radius: 50%;
    display: grid; place-items: center; font-size: 22px; font-weight: 500; line-height: 1;
    transition: all .2s;
  }
  .opt .w { font-family: var(--serif); font-size: 28px; line-height: 1.25; }
  .opt:not(:disabled):active { background: var(--hl); }
  .opt:disabled { cursor: default; }
  .opt.correct { background: var(--hl); }
  .opt.correct .c { background: var(--accent-ink); border-color: var(--accent-ink); color: #fff; }
  [data-series="green"] .opt.correct { background: rgba(175, 187, 171, .35); }
  .opt.wrong { background: var(--ng-bg); }
  .opt.wrong .c { border-color: var(--ng); color: var(--ng); }
  .opt.dim { opacity: .45 !important; }

  /* 選んでねのヒントと制限時間 */
  .timer { margin-top: 20px; animation: pop .4s .9s ease-out both; }
  .timer-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--accent-ink); }
  .timer-row .hint { animation: nudge 1.6s ease-in-out infinite; }
  .timer-row .sec { font-family: var(--serif); font-size: 22px; font-variant-numeric: tabular-nums; }
  .timer .bar { margin-top: 8px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .timer .bar i { display: block; height: 100%; width: 100%; background: var(--accent-ink); transform-origin: left; transition: transform .1s linear; }
  .timer.hurry .sec { color: var(--ng); }
  .timer.hurry .bar i { background: var(--ng); }
  .timer.over .sec, .timer.over .bar { visibility: hidden; }
  .timer.over .hint { color: var(--sub); }
  .timer.off .sec, .timer.off .bar { display: none; }
  @keyframes nudge { 0%, 100% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(-3px); opacity: .7; } }

  /* 答え合わせ・解説 */
  .reveal { margin-top: 26px; animation: pop .35s ease-out; }
  .verdict { font-size: 22px; font-weight: 700; letter-spacing: .06em; color: var(--accent-ink); }
  .verdict.ng { color: var(--ng); }
  .ja { margin-top: 10px; font-size: 15px; line-height: 1.8; color: var(--sub); }
  .gloss { margin-top: 14px; display: grid; gap: 6px; font-size: 14px; line-height: 1.6; }
  .gloss li { list-style: none; padding-left: 12px; border-left: 3px solid var(--hl); }
  .gloss b { font-family: var(--serif); font-size: 17px; font-weight: 500; }
  details { margin-top: 16px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  summary {
    list-style: none; cursor: pointer; padding: 14px 0; font-size: 15px; font-weight: 500;
    display: flex; justify-content: space-between; align-items: center; color: var(--accent-ink);
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "＋"; font-weight: 400; transition: transform .2s; }
  details[open] summary::after { transform: rotate(45deg); }
  .exp { padding: 0 0 18px; font-size: 15px; line-height: 1.9; white-space: pre-line; }
  .tag { display: inline-block; font-size: 11px; color: var(--accent-ink); background: var(--hl); padding: 2px 8px; border-radius: 4px; margin-bottom: 10px; }
  [data-series="green"] .tag { color: #fff; background: var(--accent); }

  /* ピンク:読めた？(任意) */
  .self { display: flex; align-items: center; gap: 8px; margin-top: 18px; font-size: 13px; color: var(--sub); }
  .self button { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; color: var(--sub); }
  .self button[aria-pressed="true"] { background: var(--hl); border-color: var(--hl); color: var(--accent-ink); font-weight: 500; }

  /* 解説の下のさりげないおすすめ */
  .nudge {
    display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 12px 14px; border-radius: 12px;
    background: color-mix(in srgb, var(--hl) 45%, transparent); text-decoration: none; color: var(--ink); font-size: 13px; line-height: 1.5;
  }
  .nudge small { font-size: 10px; color: #9a9a9a; letter-spacing: .1em; flex: none; }
  .nudge span { flex: 1; }
  .nudge b { font-weight: 500; }
  .nudge::after { content: "›"; font-size: 20px; color: var(--accent-ink); }

  .primary {
    display: block; width: 100%; margin-top: 24px; padding: 16px; border-radius: 14px;
    background: var(--ink); color: #fff; font-size: 16px; font-weight: 500; letter-spacing: .06em; text-align: center;
    text-decoration: none;
  }
  .primary:active { opacity: .85; }
  .ghost {
    display: block; width: 100%; margin-top: 12px; padding: 14px; border-radius: 14px;
    border: 1px solid var(--line); font-size: 14px; text-align: center; color: var(--sub); text-decoration: none;
  }
  .ghost.strong { color: var(--accent-ink); border-color: var(--hl); font-weight: 500; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .pair .primary, .pair .ghost { margin: 0; }
  .spacer { flex: 1; min-height: 24px; }

  /* メニュー */
  .lead { margin-top: 20px; font-size: 15px; line-height: 1.9; color: var(--sub); }
  .lead b { color: var(--ink); font-weight: 500; }
  .h { margin-top: 32px; font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--accent-ink); }
  .goals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .goal {
    position: relative; overflow: hidden; text-align: left; padding: 16px 14px 14px 22px; border-radius: 14px;
    background: var(--bg); border: 1px solid var(--line); min-height: 92px; display: flex; flex-direction: column; gap: 4px;
  }
  .goal::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 8px; background: var(--bar); }
  .goal b { font-size: 15px; font-weight: 700; color: var(--accent-ink); }
  .goal span { font-size: 12px; color: var(--sub); line-height: 1.5; }
  .goal small { margin-top: auto; font-size: 11px; color: #9a9a9a; }
  .goal:active { transform: scale(.98); }
  .goal.random { background: var(--ink); border-color: var(--ink); }
  .goal.random::before { background: linear-gradient(#456142 0 33%, #f7b6ba 33% 66%, #adc8d1 66%); }
  .goal.random b { color: #fff; }
  .goal.random span, .goal.random small { color: #c9c9c9; }
  .more { margin-top: 26px; }
  .more summary { font-size: 13px; padding: 12px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 16px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px;
    background: var(--hl); font-size: 14px; color: var(--ink);
  }
  .chip small { font-size: 11px; color: var(--accent-ink); }
  .chip:active { background: var(--accent); }

  /* 結果 */
  .score { font-family: var(--serif); font-size: 84px; line-height: 1; margin-top: 18px; }
  .score small { font-size: 34px; color: var(--sub); }
  .msg { margin-top: 12px; font-size: 16px; line-height: 1.8; }
  .miss { margin-top: 10px; border-top: 1px solid var(--line); }
  .miss details { margin: 0; border-top: 0; }
  .miss summary { color: var(--ink); font-weight: 400; font-family: var(--serif); font-size: 18px; line-height: 1.5; gap: 12px; align-items: flex-start; }
  .miss summary span { flex: 1; }
  .miss .ans { color: var(--accent-ink); font-weight: 500; }
  .rec { margin-top: 12px; border: 1px solid var(--line); border-radius: 16px; padding: 18px; position: relative; }
  .rec .pr { position: absolute; top: 12px; right: 14px; font-size: 10px; color: #9a9a9a; letter-spacing: .1em; }
  .rec h3 { font-size: 16px; font-weight: 700; line-height: 1.5; padding-right: 30px; }
  .rec a { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--hl); text-decoration: none; color: var(--ink); }
  .rec a b { display: block; font-size: 14px; font-weight: 500; }
  .rec a small { display: block; font-size: 12px; color: var(--sub); margin-top: 2px; }
  .rec a::after { content: "›"; font-size: 22px; color: var(--accent-ink); }

  .rec + .rec { margin-top: 14px; }
  .rec-lead { margin-top: 8px; font-size: 13px; line-height: 1.8; color: var(--sub); }
  .reel { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; font-size: 12px; color: var(--sub); text-decoration: none; }
  .reel::before { content: "▶"; font-size: 9px; color: var(--accent-ink); }

  /* フッター(アソシエイト表記は規約どおり載せつつ控えめに) */
  .foot { margin-top: 28px; font-size: 10px; line-height: 1.7; color: #b8b8b8; text-align: center; }
  .foot a { color: inherit; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="app" id="app"></main>

<script src="data.js"></script>
<script src="recommend.js"></script>
<script>
(() => {
  const QUIZZES = window.QUIZZES || [];
  const REC = window.RECOMMEND || {};
  const LINKS = window.LINKS || {};
  const SPEAK = window.SPEAK;
  const ABROAD = window.ABROAD;
  const app = document.getElementById("app");
  const CIRCLED = ["①", "②", "③", "④"];

  // 番号から色(シリーズ)を決める。リールと同じ 緑 → ピンク → 青
  const SERIES = {
    green: { name: "英検2級", title: "英検2級でよく出る", goal: "英検2級対策", desc: "2級で頻出の文法を2択で" },
    pink: { name: "読解・イディオム", title: "英検頻出！<br>これ↓読める？", goal: "イディオム", desc: "準1級・入試レベルの表現を英文で読む" },
    blue: { name: "TOEIC", title: "TOEICでよく出る", goal: "TOEIC対策", desc: "Part5で差がつく文法を2択で" },
  };
  const seriesOf = (q) => ["pink", "blue", "green"][q.no % 3];
  const isIdiom = (q) => !q.options;
  const setSeries = (s) => { document.body.dataset.series = s || "blue"; };

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const BLANK_RE = /\(\s*\)/;
  const completed = (q) => (isIdiom(q) ? q.text.replace(/\n/g, " ") : q.question.replace(BLANK_RE, q.options[q.answer - 1]));

  // ---- 英文の音声:ElevenLabs で作った mp3(q.audio)があればそれを、なければブラウザ標準の読み上げ ----
  const hasTTS = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
  const canSpeak = hasTTS || QUIZZES.some((q) => q.audio);
  let soundOn = canSpeak;
  try { if (localStorage.getItem("sound") === "off") soundOn = false; } catch (e) {}
  let voice = null;
  let player = null;
  const pickVoice = () => {
    const vs = speechSynthesis.getVoices().filter((v) => /^en[-_]US/i.test(v.lang));
    voice = vs.find((v) => /Samantha|Google US English|Aria|Jenny/i.test(v.name)) || vs[0] || null;
  };
  if (hasTTS) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

  // ---- BGM:気分で選べる。Web Audio でつなぎ目なくループし、ゆっくりフェードイン ----
  const TRACKS = [
    { id: "lefty", name: "Lefty", artist: "Blue Wednesday", mood: "Lo-fi" },
    { id: "the-waves", name: "The Waves", artist: "Otto.mp3", mood: "Lo-fi" },
    { id: "tokyo-spring", name: "Tokyo Spring (wooll Remix)", artist: "Yawnathan", mood: "Lo-fi" },
    { id: "just-flow", name: "Just Flow", artist: "Hartzmann", mood: "Chill" },
    { id: "darkside", name: "Darkside", artist: "Oliver Michael", mood: "Hip-hop" },
    { id: "to-the-moon", name: "To The Moon", artist: "21 On The Block", mood: "Hip-hop" },
    { id: "funk-formula", name: "Funk Formula", artist: "Nick Petrov", mood: "Funk" },
  ];
  const srcOf = (id) => `bgm/${id}.mp3`;
  const BGM_VOL = 0.16;
  const BGM_DUCK = 0.04;
  const FADE_IN = 1.4;  // 秒(時定数)。ガツンと鳴らないよう、数秒かけて上げる
  const AC = window.AudioContext || window.webkitAudioContext;
  const useWebAudio = !!AC && location.protocol !== "file:";
  let bgmOk = false;
  let track = null;  // 選んだ曲の id。null はオフ
  try { track = localStorage.getItem("bgmTrack"); } catch (e) {}
  if (!TRACKS.some((t) => t.id === track)) track = null;
  let ctx = null, master = null, current = null, el = null;
  const buffers = {};

  fetch(srcOf(TRACKS[0].id), { method: "HEAD" }).then((r) => { bgmOk = r.ok; refreshToggles(); }).catch(() => {
    bgmOk = location.protocol === "file:"; refreshToggles();
  });

  // mp3 の頭と最後に入る無音を飛ばして、曲の終わりと始まりを直接つなぐ
  function trimLoop(buf) {
    const d = buf.getChannelData(0);
    let a = 0, b = d.length - 1;
    while (a < b && Math.abs(d[a]) < 0.0005) a++;
    while (b > a && Math.abs(d[b]) < 0.0005) b--;
    return [a / buf.sampleRate, (b + 1) / buf.sampleRate];
  }
  async function load(id) {
    if (!buffers[id]) {
      const data = await (await fetch(srcOf(id))).arrayBuffer();
      buffers[id] = await new Promise((ok, ng) => ctx.decodeAudioData(data, ok, ng));
    }
    return buffers[id];
  }
  function fadeOut(node, sec) {
    node.gain.gain.cancelScheduledValues(ctx.currentTime);
    node.gain.gain.setTargetAtTime(0, ctx.currentTime, sec / 4);
    node.src.stop(ctx.currentTime + sec);
  }
  // iPhone はマナーモードだと Web Audio が鳴らない。曲を自分で選んだときだけ「再生」扱いに切り替える
  let silentEl = null;
  function allowSoundInSilentMode() {
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
    if (silentEl || !/iP(hone|ad|od)/.test(navigator.userAgent)) return;
    // 古い iOS 向け:無音の audio 要素を流しておくと、ページ全体が「再生」扱いになる
    const rate = 8000, n = rate / 2, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
    const str = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    str(0, "RIFF"); v.setUint32(4, 36 + n, true); str(8, "WAVEfmt "); v.setUint32(16, 16, true);
    v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate, true);
    v.setUint16(32, 1, true); v.setUint16(34, 8, true); str(36, "data"); v.setUint32(40, n, true);
    for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
    silentEl = new Audio(URL.createObjectURL(new Blob([buf], { type: "audio/wav" })));
    silentEl.loop = true;
    silentEl.setAttribute("playsinline", "");
    silentEl.play().catch(() => {});
  }

  async function bgmPlay() {
    if (!bgmOk || !track) return;
    allowSoundInSilentMode();
    if (!useWebAudio) {
      // ローカル確認用(file://)。曲の切れ目にわずかな間ができる
      if (!el || !el.src.endsWith(srcOf(track))) { if (el) el.pause(); el = new Audio(srcOf(track)); el.loop = true; }
      el.volume = BGM_VOL; el.play().catch(() => {});
      return;
    }
    if (!ctx) {
      ctx = new AC();
      master = ctx.createGain();
      master.connect(ctx.destination);
    }
    ctx.resume();
    if (current && current.id === track) return;
    const id = track;
    const buf = await load(id);
    if (track !== id) return;
    if (current) fadeOut(current, 1.5);  // 曲を変えたときは前の曲を下げながら切り替える
    const [start, end] = trimLoop(buf);
    const src = ctx.createBufferSource();
    const gain = ctx.createGain();
    src.buffer = buf;
    src.loop = true;
    src.loopStart = start;
    src.loopEnd = end;
    gain.gain.value = 0;
    src.connect(gain).connect(master);
    src.start(0, start);
    gain.gain.setTargetAtTime(BGM_VOL, ctx.currentTime, FADE_IN);
    current = { id, src, gain };
  }
  function bgmStop() {
    if (el) el.pause();
    if (current) { fadeOut(current, 1.2); current = null; }
  }
  function duck(on) {
    const v = on ? BGM_DUCK / BGM_VOL : 1;
    if (master) master.gain.setTargetAtTime(v, ctx.currentTime, 0.15);
    else if (el) el.volume = on ? BGM_DUCK : BGM_VOL;
  }

  function stopVoice() {
    if (player) { player.pause(); player = null; }
    if (hasTTS) speechSynthesis.cancel();
    duck(false);
  }
  function speak(q) {
    stopVoice();
    duck(true);
    if (q.audio) {
      player = new Audio(q.audio);
      player.onended = () => duck(false);
      player.play().catch(() => duck(false));
      return;
    }
    if (!hasTTS) return duck(false);
    const u = new SpeechSynthesisUtterance(completed(q));
    u.lang = "en-US";
    u.rate = 0.92;
    if (voice) u.voice = voice;
    u.onend = () => duck(false);
    speechSynthesis.speak(u);
  }
  const clockSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>';
  const musicSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
  const speakerSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  const mutedSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m22 9-6 6M16 9l6 6"/></svg>';

  // ---- 状態 ----
  let set = [];
  let idx = 0;
  let results = [];

  // 間違えた(読めなかった)問題の番号を端末に記録(ログイン不要の復習用)
  const loadMissed = () => { try { return JSON.parse(localStorage.getItem("missed") || "[]"); } catch (e) { return []; } };
  function recordResult(no, ok) {
    const missed = new Set(loadMissed());
    ok ? missed.delete(no) : missed.add(no);
    try { localStorage.setItem("missed", JSON.stringify([...missed])); } catch (e) {}
  }

  const shuffle = (a) => a.map((v) => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map((x) => x[1]);
  const sorted = [...QUIZZES].sort((a, b) => a.no - b.no);

  // おすすめ:分野 → シリーズ → default の順に、リンクが入っているものを探す
  function recFor(q) {
    const keys = [q && q.category, q && SERIES[seriesOf(q)].name, "default"];
    for (const k of keys) {
      const r = k && REC[k];
      if (r && r.items.some((it) => it.url && it.url !== "#")) return { ...r, items: r.items.filter((it) => it.url && it.url !== "#") };
    }
    return null;
  }

  // A8 は表示回数の計測用に 1×1 の画像をリンクと一緒に置く決まり
  const pix = (it) => (it.pixel ? `<img src="${esc(it.pixel)}" width="1" height="1" alt="" style="position:absolute;width:1px;height:1px;opacity:0">` : "");
  const recLink = (it) => `<a href="${esc(it.url)}" target="_blank" rel="noopener sponsored nofollow"><span><b>${esc(it.name)}</b><small>${esc(it.note || "")}</small></span></a>${pix(it)}`;

  function begin(quizzes) {
    if (!quizzes.length) return;
    set = quizzes.slice(0, 10);
    idx = 0;
    results = [];
    bgmPlay();
    renderItem();
  }

  function toggles() {
    const now = TRACKS.find((t) => t.id === track);
    const music = bgmOk ? `
      <div class="bgm-wrap">
        <button class="sound" id="bgm" aria-pressed="${!!track}" aria-haspopup="true" aria-label="BGMを選ぶ">${musicSvg}${now ? esc(now.name) : "BGM OFF"}</button>
        <div class="bgm-menu" id="bgm-menu" hidden>
          <p>BGM</p>
          ${TRACKS.map((t) => `<button data-track="${t.id}" aria-checked="${t.id === track}"><span>${esc(t.name)}</span><small>${t.mood}</small></button>`).join("")}
          <button data-track="" aria-checked="${!track}"><span>オフ</span></button>
          <p class="credit">Music from <a href="https://uppbeat.io" target="_blank" rel="noopener">#Uppbeat</a> (free for Creators!)${now ? `<br>${esc(now.name)} / ${esc(now.artist)}` : ""}</p>
        </div>
      </div>` : "";
    const sound = canSpeak
      ? `<button class="sound" id="sound" aria-pressed="${soundOn}" aria-label="英文の音声">${soundOn ? speakerSvg : mutedSvg}${soundOn ? "音声ON" : "音声OFF"}</button>`
      : "";
    const timer = `<button class="sound" id="timer-toggle" aria-pressed="${timerOn}" aria-label="制限時間">${clockSvg}${timerOn ? TIME_LIMIT + "秒" : "時間OFF"}</button>`;
    return `<div class="toggles" id="toggles">${music}${timer}${sound}</div>`;
  }
  function header() {
    const dots = set.map((_, i) => `<i class="${i < idx ? "done" : i === idx ? "now" : ""}"></i>`).join("");
    return `<div class="top"><div class="lefthead"><button class="home" id="home" aria-label="トップに戻る">‹ トップ</button><div class="progress" aria-label="${idx + 1} / ${set.length}問目">${dots}</div></div>${toggles()}</div>`;
  }
  function refreshToggles() {
    const t = document.getElementById("toggles");
    if (t) { t.outerHTML = toggles(); bindSound(); }
  }
  function bindSound() {
    const m = document.getElementById("bgm");
    const menu = document.getElementById("bgm-menu");
    if (m) {
      m.onclick = (e) => { e.stopPropagation(); menu.hidden = !menu.hidden; };
      menu.querySelectorAll("[data-track]").forEach((b) => (b.onclick = () => {
        track = b.dataset.track || null;
        try { localStorage.setItem("bgmTrack", track || ""); } catch (e) {}
        track ? bgmPlay() : bgmStop();
        refreshToggles();
      }));
    }
    const home = document.getElementById("home");
    if (home) home.onclick = renderStart;
    const tt = document.getElementById("timer-toggle");
    if (tt) tt.onclick = () => {
      timerOn = !timerOn;
      try { localStorage.setItem("timer", timerOn ? "on" : "off"); } catch (e) {}
      const timer = document.getElementById("timer");
      if (timer) {
        timer.classList.toggle("off", !timerOn);
        timer.classList.remove("hurry", "over");
        timer.querySelector(".hint").textContent = "👆 タップして答えを選んでね";
        timerOn ? startTimer() : stopTimer();
      }
      refreshToggles();
    };
    const b = document.getElementById("sound");
    if (b) b.onclick = () => {
      soundOn = !soundOn;
      try { localStorage.setItem("sound", soundOn ? "on" : "off"); } catch (e) {}
      if (!soundOn) stopVoice();
      b.setAttribute("aria-pressed", soundOn);
      b.innerHTML = (soundOn ? speakerSvg : mutedSvg) + (soundOn ? "音声ON" : "音声OFF");
    };
  }

  const footer = () => `
    <p class="foot">
      Instagram <a href="${esc(LINKS.instagram || "#")}" target="_blank" rel="noopener">@eng_navi</a> のリールの続きです。<br>
      Amazonのアソシエイトとして、eng_naviは適格販売により収入を得ています。<br>
      BGM: Music from <a href="https://uppbeat.io" target="_blank" rel="noopener">#Uppbeat</a> (free for Creators!) — ${TRACKS.map((t) => `${esc(t.name)} / ${esc(t.artist)}`).join("、")}
    </p>`;

  // ---- メニュー ----
  function renderStart() {
    stopVoice();
    stopTimer();
    setSeries("blue");
    const bySeries = { green: [], pink: [], blue: [] };
    sorted.forEach((q) => bySeries[seriesOf(q)].push(q));
    const quizzes = sorted.filter((q) => !isIdiom(q));
    const ranges = [];
    for (let i = 0; i < sorted.length; i += 10) ranges.push(sorted.slice(i, i + 10));
    const cats = {};
    quizzes.forEach((q) => { if (q.category) (cats[q.category] = cats[q.category] || []).push(q); });
    const missedNos = new Set(loadMissed());
    const missed = sorted.filter((q) => missedNos.has(q.no));

    const goal = (key) => bySeries[key].length ? `
      <button class="goal" data-series="${key}" data-goal="${key}">
        <b>${SERIES[key].goal}</b><span>${SERIES[key].desc}</span><small>${bySeries[key].length}問</small>
      </button>` : "";

    app.innerHTML = `
      <div class="top"><span></span>${toggles()}</div>
      <p class="num">${sorted.length}</p>
      <h1 class="title">eng_navi<br>英語クイズ</h1>
      <p class="lead">リールで出している問題の<b>続き</b>です。過去の問題も<b>すべて無料・登録不要</b>。<br>タップで答え合わせ、<b>音声つき</b>で解説も読めます。</p>
      <button class="primary" id="latest">最新の問題をとく</button>
      ${missed.length ? `<button class="ghost strong" id="missed">前に間違えた問題を復習する(${missed.length}問)</button>` : ""}
      <p class="h">目的からえらぶ</p>
      <div class="goals">
        ${goal("blue")}${goal("green")}${goal("pink")}
        <button class="goal random" id="random"><b>実力試し</b><span>全シリーズからランダムに10問</span><small>シャッフル</small></button>
      </div>
      ${Object.keys(cats).length ? `
        <details class="more">
          <summary>文法の項目からえらぶ</summary>
          <div class="chips">${Object.keys(cats).map((c) => `<button class="chip" data-cat="${esc(c)}">${esc(c)}<small>${cats[c].length}</small></button>`).join("")}</div>
        </details>` : ""}
      <details class="more" style="margin-top:0;border-top:0">
        <summary>番号からえらぶ</summary>
        <div class="chips">${ranges.map((r, i) => `<button class="chip" data-range="${i}">No.${r[0].no}〜${r[r.length - 1].no}</button>`).join("")}</div>
      </details>
      <div class="spacer"></div>
      ${footer()}`;
    bindSound();
    window.scrollTo({ top: 0 });

    document.getElementById("latest").onclick = () => begin(sorted.slice(-10));
    document.getElementById("random").onclick = () => begin(shuffle(sorted));
    const m = document.getElementById("missed");
    if (m) m.onclick = () => begin(shuffle(missed));
    app.querySelectorAll("[data-goal]").forEach((b) => (b.onclick = () => begin(shuffle(bySeries[b.dataset.goal]))));
    app.querySelectorAll("[data-cat]").forEach((b) => (b.onclick = () => begin(shuffle(cats[b.dataset.cat]))));
    app.querySelectorAll("[data-range]").forEach((b) => (b.onclick = () => begin(ranges[b.dataset.range])));
  }

  // ---- 問題(緑・青は2択、ピンクは読んで意味を確認) ----
  function renderItem() {
    const q = set[idx];
    const s = seriesOf(q);
    setSeries(s);
    const head = `${header()}<p class="num">${esc(q.no)}</p><h2 class="title">${SERIES[s].title}</h2>`;

    if (isIdiom(q)) {
      const [before, after] = q.text.split(q.target);
      const body = esc(before) + (after !== undefined ? `<span class="mark">${esc(q.target)}</span>${esc(after)}` : "");
      app.innerHTML = `${head}
        <p class="q" style="white-space:pre-line">${body}</p>
        <div id="after"><button class="primary" id="show">意味を見る</button></div>`;
      document.getElementById("show").onclick = () => revealIdiom(q);
    } else {
      const parts = q.question.split(BLANK_RE);
      const sentence = `<span class="mark">${esc(parts[0])}<span class="nw">(<span class="blank" id="blank">   </span>)</span>${esc(parts[1] || "")}</span>`;
      app.innerHTML = `${head}
        <p class="q">${sentence}</p>
        <div class="opts">
          ${q.options.map((o, i) => `<button class="opt" data-i="${i + 1}"><span class="c">${i + 1}</span><span class="w">${esc(o)}</span></button>`).join("")}
        </div>
        <div class="timer ${timerOn ? "" : "off"}" id="timer">
          <div class="timer-row"><span class="hint">👆 タップして答えを選んでね</span><span class="sec" id="sec">${TIME_LIMIT}</span></div>
          <div class="bar"><i id="bar"></i></div>
        </div>
        <div id="after"></div>`;
      app.querySelectorAll(".opt").forEach((b) => (b.onclick = () => answer(q, Number(b.dataset.i))));
      startTimer();
    }
    bindSound();
    window.scrollTo({ top: 0 });
  }

  function explanationBlock(q, open) {
    const r = recFor(q);
    const nudge = r ? `<a class="nudge" href="${esc(r.items[0].url)}" target="_blank" rel="noopener sponsored nofollow"><small>PR</small><span>${esc(r.title)}<br><b>${esc(r.items[0].name)}</b></span></a>${pix(r.items[0])}` : "";
    return `
      <details ${open ? "open" : ""}>
        <summary>解説を見る</summary>
        <div class="exp">${q.category ? `<span class="tag">${esc(q.category)}</span>\n` : ""}${esc(q.explanation || "")}</div>
      </details>
      ${nudge}
      ${q.permalink ? `<a class="reel" href="${esc(q.permalink)}" target="_blank" rel="noopener">このリールを Instagram で見る</a>` : ""}`;
  }

  // ---- 制限時間(右上でON/OFF。時間が来ても答えは開かず、そのまま考えてよい) ----
  const TIME_LIMIT = 15;
  let timerOn = true;
  try { timerOn = localStorage.getItem("timer") !== "off"; } catch (e) {}
  let timerId = null;
  function startTimer() {
    stopTimer();
    if (!timerOn) return;
    const start = performance.now();
    let last = TIME_LIMIT;
    timerId = setInterval(() => {
      const left = Math.min(TIME_LIMIT, Math.max(0, TIME_LIMIT - (performance.now() - start) / 1000));
      const sec = Math.ceil(left);
      const bar = document.getElementById("bar");
      if (!bar) return stopTimer();
      bar.style.transform = `scaleX(${left / TIME_LIMIT})`;
      if (sec !== last) {
        last = sec;
        document.getElementById("sec").textContent = sec;
        if (sec <= 5) document.getElementById("timer").classList.add("hurry");
      }
      if (left <= 0) {
        stopTimer();
        const timer = document.getElementById("timer");
        timer.classList.add("over");
        timer.querySelector(".hint").textContent = "時間になりました。じっくり考えてOK 👆";
      }
    }, 100);
  }
  function stopTimer() {
    clearInterval(timerId);
    timerId = null;
  }

  function next() {
    stopVoice();
    idx++;
    idx >= set.length ? renderResult() : renderItem();
  }

  function answer(q, choice) {
    stopTimer();
    const timer = document.getElementById("timer");
    if (timer) timer.remove();
    const ok = choice === q.answer;
    results[idx] = { q, ok };
    recordResult(q.no, ok);
    app.querySelectorAll(".opt").forEach((b) => {
      const i = Number(b.dataset.i);
      b.disabled = true;
      if (i === q.answer) b.classList.add("correct");
      else if (i === choice) b.classList.add("wrong");
      else b.classList.add("dim");
      if (i === choice && !ok) b.querySelector(".c").textContent = "×";
    });
    const blank = document.getElementById("blank");
    blank.textContent = q.options[q.answer - 1];
    blank.classList.add("filled");

    const after = document.getElementById("after");
    after.innerHTML = `
      <div class="reveal">
        <p class="verdict ${ok ? "" : "ng"}">${ok ? "正解！" : `不正解… 正解は ${CIRCLED[q.answer - 1]}`}</p>
        <p class="ja">${esc(q.translation || "")}</p>
        ${canSpeak ? `<button class="listen" id="listen">${speakerSvg}英文を聞く</button>` : ""}
        ${explanationBlock(q, !ok)}
        <button class="primary" id="next">${idx === set.length - 1 ? "結果を見る" : "次の問題へ"}</button>
      </div>`;
    const listen = document.getElementById("listen");
    if (listen) listen.onclick = () => speak(q);
    if (soundOn) speak(q);
    document.getElementById("next").onclick = next;
    after.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function revealIdiom(q) {
    const after = document.getElementById("after");
    const gloss = (q.glossary || []).map((g) => {
      const [en, ja] = g.split("：");
      return `<li><b>${esc(en)}</b>${ja ? `<br>${esc(ja)}` : ""}</li>`;
    }).join("");
    after.innerHTML = `
      <div class="reveal">
        <p class="ja" style="margin-top:0">${esc(q.translation || "")}</p>
        ${canSpeak ? `<button class="listen" id="listen">${speakerSvg}英文を聞く</button>` : ""}
        ${gloss ? `<ul class="gloss">${gloss}</ul>` : ""}
        ${explanationBlock(q, true)}
        <div class="self">
          <span>読めた？</span>
          <button data-ok="1" aria-pressed="false">読めた</button>
          <button data-ok="0" aria-pressed="false">むずかしかった</button>
        </div>
        <button class="primary" id="next">${idx === set.length - 1 ? "結果を見る" : "次の問題へ"}</button>
      </div>`;
    const listen = document.getElementById("listen");
    if (listen) listen.onclick = () => speak(q);
    if (soundOn) speak(q);
    // 「読めた？」は答えなくても進める。選んだ場合だけ復習リストに反映する
    results[idx] = { q, ok: true };
    after.querySelectorAll("[data-ok]").forEach((b) => (b.onclick = () => {
      const ok = b.dataset.ok === "1";
      results[idx] = { q, ok };
      recordResult(q.no, ok);
      after.querySelectorAll("[data-ok]").forEach((x) => x.setAttribute("aria-pressed", x === b));
    }));
    document.getElementById("next").onclick = next;
    after.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  // ---- 結果 ----
  function renderResult() {
    setSeries("blue");
    const total = results.length;
    const score = results.filter((r) => r.ok).length;
    const missed = results.filter((r) => !r.ok);
    const msg =
      score === total ? "全問クリア！ この調子で毎日1問続けましょう。" :
      score >= total * 0.7 ? "あと少し！ 間違えた問題だけ見直せば完璧です。" :
      score >= total * 0.4 ? "伸びしろたっぷり。苦手な分野を1つずつ潰していきましょう。" :
      "まずは頻出ポイントの確認から。下の解説を読むだけでも効果があります。";

    // 一番多く間違えた分野(なければシリーズ)のおすすめを出す
    const counts = {};
    missed.forEach((r) => { const k = r.q.category || SERIES[seriesOf(r.q)].name; counts[k] = (counts[k] || 0) + 1; });
    const worst = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
    const sample = missed.find((r) => (r.q.category || SERIES[seriesOf(r.q)].name) === worst);
    // 全問正解なら「次の一歩」(up)、そうでなければ苦手に合わせたおすすめ
    const base = REC[SERIES[seriesOf(set[0])].name];
    const rec = missed.length ? recFor(sample.q) : (base && base.up) || recFor(set[0]);

    const line = (q) => isIdiom(q)
      ? esc(q.text.replace(/\n/g, " ")).replace(esc(q.target), `<span class="ans">${esc(q.target)}</span>`)
      : esc(q.question).replace(BLANK_RE, `(<span class="ans">${esc(q.options[q.answer - 1])}</span>)`);

    app.innerHTML = `
      <div class="top"><span></span>${toggles()}</div>
      <h2 class="title">結果</h2>
      <p class="score">${score}<small> / ${total}</small></p>
      <p class="msg">${msg}</p>
      ${missed.length ? `
        <p class="h">見直す問題</p>
        <div class="miss">
          ${missed.map((r) => `
            <details>
              <summary><span>${line(r.q)}</span></summary>
              <div class="exp">${r.q.translation ? esc(r.q.translation) + "\n\n" : ""}${esc(r.q.explanation || "")}</div>
            </details>`).join("")}
        </div>` : ""}
      ${rec ? `
        <p class="h">${missed.length ? "あなたへのおすすめ" : "さらに上を目指すなら"}</p>
        <div class="rec">
          <span class="pr">PR</span>
          <h3>${esc(rec.title)}</h3>
          ${rec.items.map(recLink).join("")}
        </div>` : ""}
      ${SPEAK ? `
        <div class="rec">
          <span class="pr">PR</span>
          <h3>${esc(SPEAK.title)}</h3>
          <p class="rec-lead">文法で正解できても、会話ではとっさに出てこない…という人は多いです。声に出す練習を足すと、知っている英文が使える英文に変わります。</p>
          ${SPEAK.items.map(recLink).join("")}
        </div>` : ""}
      ${ABROAD ? `
        <div class="rec">
          <span class="pr">PR</span>
          <h3>✈️ 海外で英語を使ってみたい人へ</h3>
          <p class="rec-lead">${esc(ABROAD.lead)}</p>
          ${recLink(ABROAD.item)}
        </div>` : ""}
      <div class="spacer"></div>
      <button class="primary" id="retry">同じ問題にもう一度チャレンジ</button>
      <button class="ghost strong" id="menu">ほかの問題をえらぶ</button>
      ${footer()}`;
    bindSound();
    window.scrollTo({ top: 0 });
    document.getElementById("retry").onclick = () => begin(set);
    document.getElementById("menu").onclick = renderStart;
  }

  document.addEventListener("click", (e) => {
    const menu = document.getElementById("bgm-menu");
    if (menu && !menu.hidden && !e.target.closest(".bgm-wrap")) menu.hidden = true;
  });

  QUIZZES.length ? renderStart() : (app.innerHTML = "<p>問題がありません</p>");
})();
</script>
</body>
</html>
