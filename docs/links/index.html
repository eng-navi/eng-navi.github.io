<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>リンク集(自分用)</title>
<style>
  :root { --bg: #f5f3ef; --ink: #222; --sub: #777; --line: #e2ded6; --accent: #d24842; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; padding: 20px 16px 40px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; }
  .lead { font-size: 12px; color: var(--sub); margin-top: 6px; line-height: 1.7; }
  h2 { font-size: 13px; color: var(--sub); margin: 26px 0 8px; letter-spacing: .06em; }
  .item { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 10px; }
  .item b { display: block; font-size: 15px; }
  .item small { display: block; font-size: 11px; color: var(--sub); margin-top: 4px; word-break: break-all; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  button, .open { flex: 1; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600; text-align: center; text-decoration: none; border: 0; }
  button { background: var(--accent); color: #fff; }
  button.done { background: #3a7d5c; }
  .open { background: #eee; color: var(--ink); }
</style>
</head>
<body>
<h1>リンク集(自分用)</h1>
<p class="lead">ストーリーのリンクスタンプ用。「コピー」を押して、スタンプのURL欄に貼り付け。<br>中身は recommend.js(ITEMS)と、この下の EXTRA から作られます。</p>
<div id="list"></div>

<script src="/recommend.js"></script>
<script>
  // サイトのおすすめに入っていない、ストーリー用のリンクはここに足す
  const EXTRA = [
    { group: "ストーリー用", name: "eng_navi 無料アーカイブ(サイト)", url: "https://eng-navi.github.io/?utm_source=instagram&utm_medium=story" },
  ];
  const items = Object.values(window.ITEMS || {}).map((it) => ({ group: it.url.includes("amazon") ? "Amazon(本)" : "A8(アプリ・サービス)", ...it }));
  const all = [...EXTRA, ...items];
  const groups = [...new Set(all.map((x) => x.group))];
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  document.getElementById("list").innerHTML = groups.map((g) => `<h2>${esc(g)}</h2>` + all.filter((x) => x.group === g).map((x) => `
    <div class="item">
      <b>${esc(x.name)}</b>
      <small>${esc(x.url)}</small>
      <div class="row"><button data-url="${esc(x.url)}">コピー</button><a class="open" href="${esc(x.url)}" target="_blank" rel="noopener">開いて確認</a></div>
    </div>`).join("")).join("");

  document.addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-url]");
    if (!b) return;
    try {
      await navigator.clipboard.writeText(b.dataset.url);
    } catch (err) {
      // 古いブラウザ向け
      const t = document.createElement("textarea");
      t.value = b.dataset.url; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove();
    }
    b.textContent = "コピーしました ✓"; b.classList.add("done");
    setTimeout(() => { b.textContent = "コピー"; b.classList.remove("done"); }, 1500);
  });
</script>
</body>
</html>
