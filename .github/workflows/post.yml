# 予約表(schedule.json)を15分おきに確認し、時間になった問題を投稿する
name: 予約投稿
on:
  schedule:
    # GitHub の定期実行は毎時0分・15分などが混みやすいので、少しずらす
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 schedule.py run
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SITE_URL: https://eng-navi.github.io
      - name: 4コマ(@yonkoma_eigo)
        if: always()
        run: python3 manga_post.py run
        env:
          MANGA_IG_USER_ID: ${{ secrets.MANGA_IG_USER_ID }}
          MANGA_IG_ACCESS_TOKEN: ${{ secrets.MANGA_IG_ACCESS_TOKEN }}
          SITE_URL: https://eng-navi.github.io
      - name: 名探偵アイビー(@vocab_flicks)
        if: always()
        run: |
          git pull -q --rebase --autostash || true
          python3 ivy_post.py run
        env:
          IVY_IG_USER_ID: ${{ secrets.IVY_IG_USER_ID }}
          IVY_IG_ACCESS_TOKEN: ${{ secrets.IVY_IG_ACCESS_TOKEN }}
          SITE_URL: https://eng-navi.github.io
      - name: 科学クイズ(@mokumoku_kun)
        if: always()
        run: |
          git pull -q --rebase --autostash || true
          python3 sci_post.py run
        env:
          SCI_IG_USER_ID: ${{ secrets.SCI_IG_USER_ID }}
          SCI_IG_ACCESS_TOKEN: ${{ secrets.SCI_IG_ACCESS_TOKEN }}
          SITE_URL: https://eng-navi.github.io
      - name: 海クイズ(@rio_devlog)
        if: always()
        run: |
          git pull -q --rebase --autostash || true
          python3 sea_post.py run
        env:
          SEA_IG_USER_ID: ${{ secrets.SEA_IG_USER_ID }}
          SEA_IG_ACCESS_TOKEN: ${{ secrets.SEA_IG_ACCESS_TOKEN }}
          SITE_URL: https://eng-navi.github.io
      - name: quizify(@quizify_english)
        if: always()
        run: |
          git pull -q --rebase --autostash || true
          python3 quizify_post.py run
        env:
          QUIZIFY_IG_USER_ID: ${{ secrets.QUIZIFY_IG_USER_ID }}
          QUIZIFY_IG_ACCESS_TOKEN: ${{ secrets.QUIZIFY_IG_ACCESS_TOKEN }}
          SITE_URL: https://eng-navi.github.io
      - name: quizify の Threads(Instagram の30分後)
        if: always()
        run: |
          git pull -q --rebase --autostash || true
          python3 quizify_threads.py run
        env:
          QUIZIFY_THREADS_USER_ID: ${{ secrets.QUIZIFY_THREADS_USER_ID }}
          QUIZIFY_THREADS_ACCESS_TOKEN: ${{ secrets.QUIZIFY_THREADS_ACCESS_TOKEN }}
      - name: Threads(eng_navi)
        if: always()
        run: |
          git pull -q --rebase --autostash || true
          python3 threads_queue.py run
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain threads_queue_posted.json)" ]; then
            git add threads_queue_posted.json && git commit -q -m "Threads の投稿記録" && git pull -q --rebase --autostash && git push -q
          fi
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      - name: フレーズのストーリー(eng_navi)
        if: always()
        run: |
          git pull -q --rebase --autostash || true
          python3 story_phrase.py run
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SITE_URL: https://eng-navi.github.io
