# 予約表(schedule.json)を15分おきに確認し、時間になった問題を投稿する
name: 予約投稿
on:
  schedule:
    # GitHub の定期実行は毎時0分・15分などが混みやすいので、少しずらす
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 schedule.py run
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SITE_URL: https://eng-navi.github.io
      - name: 4コマ(@yonkoma_eigo)
        if: always()
        run: python3 manga_post.py run
        env:
          MANGA_IG_USER_ID: ${{ secrets.MANGA_IG_USER_ID }}
          MANGA_IG_ACCESS_TOKEN: ${{ secrets.MANGA_IG_ACCESS_TOKEN }}
          SITE_URL: https://eng-navi.github.io
